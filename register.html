<!DOCTYPE html>
<html>
    <head>
    <title>Login</title>
   <script src="https://kit.fontawesome.com/cabdfe68ff.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
<div class="container">

<h2>Register</h2>

<div class="input-box">
    <i class="fa-solid fa-user" style="color: rgb(108, 92, 231);"></i>
    <input type="text" placeholder="Full Name"></input>
</div>

<div class="input-box">
<i class="fa-regular fa-envelope" style="color: rgb(108, 92, 231);"></i>
    <input type="email" placeholder="Email"></input>
</div>

<div class="input-box">
   <i class="fa-solid fa-lock " style="color: rgb(108, 92, 231);"></i>
    <input type="password" placeholder="Password"></input>
</div>
<button>Register</button>

<p>
    Already have an account?
    <a href="login.html">Login</a>
</p>
</div>
    </body>
</html>
